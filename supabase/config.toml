# Supabase project-configuratie (voor de CLI).
# De statusknop komt uit een e-mail (zonder login), dus JWT-controle uit.
project_id = "monteur-app"

[functions.bestelling-status]
verify_jwt = false

# Foto's bij een bestelling: de mail wordt zonder login geopend; toegang via de bestelcode.
[functions.bestelling-fotos]
verify_jwt = false

# Nachtelijke opruiming (pg_cron); wist alleen foto's ouder dan 7 dagen.
[functions.fotos-opruimen]
verify_jwt = false

# Verslag-PDF: alleen ingelogde gebruikers (de functie controleert maker of beheerder zelf).
[functions.verslag-pdf]
verify_jwt = true

# Beheerpaneel: alleen ingelogde beheerders (de functie controleert de rol zelf).
[functions.meldingen-beheer]
verify_jwt = true
