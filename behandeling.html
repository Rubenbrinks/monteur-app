<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bestelling afgerond — Emondt</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif; margin: 0; min-height: 100vh;
    background: #041c42; color: #fff; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .kaart {
    background: #0a2550; border: 1px solid #1c3a6b; border-radius: 16px;
    padding: 32px 28px; max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .emoji { font-size: 58px; line-height: 1; margin-bottom: 6px; }
  h1 { color: #AEC336; font-size: 22px; margin: 10px 0 8px; }
  p { color: #cfd8e6; font-size: 15px; line-height: 1.55; margin: 6px 0; }
  .veld { text-align: left; margin-top: 20px; }
  .veld label {
    display: block; font-size: 13px; font-weight: bold; color: #AEC336;
    margin-bottom: 6px;
  }
  .veld input {
    width: 100%; font-family: inherit; font-size: 15px; padding: 12px 14px;
    border-radius: 10px; border: 1px solid #1c3a6b; background: #041c42;
    color: #fff;
  }
  .veld input::placeholder { color: #5a6e91; }
  .veld input:focus { outline: 2px solid #AEC336; outline-offset: 1px; border-color: #AEC336; }
  .veld .hint { font-size: 12px; color: #7a8aa0; margin-top: 5px; }
  .knop {
    display: inline-block; background: #639922; color: #fff; border: none;
    font-weight: bold; font-size: 16px; padding: 15px 30px; border-radius: 10px;
    cursor: pointer; margin-top: 22px; transition: background .15s;
  }
  .knop:hover { background: #71ad27; }
  .knop:disabled { opacity: .6; cursor: default; }
  .klein { font-size: 12px; color: #7a8aa0; margin-top: 18px; }
</style>
</head>
<body>
  <div class="kaart" id="kaart">
    <div class="emoji">📦</div>
    <h1>Bestelling afgerond?</h1>
    <p id="sub">Je zet deze bestelling op afgerond. De monteur krijgt hiervan een melding.</p>

    <div class="veld" id="veld-besteld-door">
      <label for="besteld-door">Besteld door</label>
      <input type="text" id="besteld-door" placeholder="je naam" autocomplete="name"
        onkeydown="if(event.key==='Enter')rondBestellingAf()" />
      <div class="hint">Optioneel — de monteur ziet deze naam in de app.</div>
    </div>

    <button class="knop" id="btn" onclick="rondBestellingAf()">✅ Bestelling afgerond</button>
    <div class="klein">Emondt Materiaalapp</div>
  </div>

<script>
  const SUPABASE_URL = 'https://tjypxqquiseejzcwfgwm.supabase.co';
  const p = new URLSearchParams(location.search);
  const id = p.get('id');
  const token = p.get('token');

  function toon(emoji, titel, tekst, knop) {
    document.querySelector('.emoji').textContent = emoji;
    document.querySelector('h1').textContent = titel;
    document.getElementById('sub').innerHTML = tekst;
    document.getElementById('btn').style.display = knop ? 'inline-block' : 'none';
    // Het invulveld hoort alleen bij de vraag, niet bij het antwoord.
    const veld = document.getElementById('veld-besteld-door');
    if (veld) veld.style.display = knop ? 'block' : 'none';
  }

  if (!id || !token) {
    toon('⚠️', 'Ongeldige link', 'Deze link is niet compleet.', false);
  }

  async function rondBestellingAf() {
    const btn = document.getElementById('btn');
    const bestelder = (document.getElementById('besteld-door')?.value || '').trim();
    btn.disabled = true; btn.textContent = '⏳ Bezig...';
    const herstel = () => { btn.disabled = false; btn.textContent = '✅ Bestelling afgerond'; };
    try {
      const res = await fetch(
        `${SUPABASE_URL}/functions/v1/bestelling-status?id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}&status=in_behandeling&besteld_door=${encodeURIComponent(bestelder)}`,
        { method: 'POST' }
      );
      const data = await res.json().catch(() => ({}));
      switch (data.status) {
        case 'ok':
          toon('✅', 'Gelukt!',
            `De bestelling${data.projectnaam ? ' voor <b>' + data.projectnaam + '</b>' : ''} staat nu op afgerond.` +
            (data.verstuurd ? ' De monteur is met een melding op de hoogte gebracht.' : ' De monteur ziet de status in de app.'),
            false);
          break;
        case 'al_bijgewerkt':
          toon('ℹ️', 'Al afgerond', 'Deze bestelling was al afgerond.', false);
          break;
        case 'ongeldige_code':
          toon('⛔', 'Ongeldige code', 'De beveiligingscode klopt niet.', false);
          break;
        case 'niet_gevonden':
          toon('⚠️', 'Niet gevonden', 'Deze bestelling bestaat niet (meer).', false);
          break;
        default:
          toon('⚠️', 'Er ging iets mis', 'Probeer het later opnieuw.', true);
          herstel();
      }
    } catch (e) {
      toon('⚠️', 'Verbinding mislukt', 'Controleer je internet en probeer opnieuw.', true);
      herstel();
    }
  }
</script>
</body>
</html>
